<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="120" y1="100" x2="392" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shield Shape Outer Border -->
  <path d="M256 64 C350 64 416 88 416 88 C416 260 350 376 256 448 C162 376 96 260 96 88 C96 88 162 64 256 64 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)" />

  <!-- Graduation Mortarboard Top -->
  <path d="M256 140 L380 190 L256 240 L132 190 Z" fill="url(#goldGrad)" />
  <path d="M200 220 L200 270 C200 295 312 295 312 270 L312 220" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Tassel -->
  <path d="M350 200 L370 260" stroke="#fef08a" stroke-width="5" stroke-linecap="round" />
  <circle cx="370" cy="264" r="6" fill="#fef08a" />

  <!-- Open Book of Knowledge -->
  <g transform="translate(156, 290)">
    <!-- Left Page -->
    <path d="M100 80 C60 70 20 75 0 85 L0 25 C20 15 60 10 100 20 Z" fill="#ffffff" opacity="0.95" />
    <!-- Right Page -->
    <path d="M100 80 C140 70 180 75 200 85 L200 25 C180 15 140 10 100 20 Z" fill="#ffffff" opacity="0.95" />
    <!-- Book Spine & Divider -->
    <path d="M100 15 L100 85" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- Decorative page lines -->
    <line x1="20" y1="36" x2="80" y2="33" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="48" x2="80" y2="45" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="60" x2="70" y2="57" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="120" y1="33" x2="180" y2="36" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="120" y1="45" x2="180" y2="48" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="130" y1="57" x2="180" y2="60" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Laurel Wreath Accents -->
  <path d="M120 280 C110 330 140 380 180 400" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 12" />
  <path d="M392 280 C402 330 372 380 332 400" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 12" />

  <!-- Star of Excellence -->
  <polygon points="256,380 262,395 278,395 265,405 270,420 256,410 242,420 247,405 234,395 250,395" fill="url(#goldGrad)" />
</svg>
